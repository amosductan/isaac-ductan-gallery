<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Games</title>
<style>
@font-face{font-family:'Fredoka';font-style:normal;font-weight:500 700;font-display:swap;src:url(fonts/fredoka.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:600 800;font-display:swap;src:url(fonts/nunito.woff2) format('woff2')}
:root{--bg:#fffdf7;--ink:#2d2a26;--soft:#6f685f;--accent:#ff8a50;--accent-ink:#c2531d;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','Segoe UI',system-ui,sans-serif;font-weight:600;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
main{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.back{align-self:flex-start;color:var(--accent-ink);text-decoration:none;font-weight:800;font-size:.95rem;display:inline-flex;align-items:center;gap:.4em;padding:.4em 0}
.back svg{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:'Fredoka','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:700;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;margin:0}
h1 i{font-style:normal;color:var(--accent-ink)}
.lead{margin:-10px 0 0;color:var(--soft);font-size:1.05rem}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:18px}
.game{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;text-decoration:none;color:#fff;border-radius:28px;padding:22px 18px 20px;
  background:linear-gradient(180deg,var(--b),var(--a));box-shadow:0 8px 0 rgba(0,0,0,.14),0 16px 28px rgba(0,0,0,.16);transition:transform .12s}
.game:hover,.game:focus-visible{transform:translateY(-4px)}
.game:focus-visible,.back:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.pics{display:flex;justify-content:center;gap:6px;background:#fffdf8;border-radius:999px;padding:10px 18px;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.pics svg{width:clamp(48px,13vw,64px);height:clamp(48px,13vw,64px)}
.name{font-family:'Fredoka','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:700;font-size:1.6rem;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.blurb{font-size:.95rem;opacity:.92;text-wrap:balance}
.play{margin-top:4px;font-family:'Fredoka','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:600;font-size:1.25rem;background:#ffd43b;color:#2d2a26;border-radius:999px;padding:.45em 1.6em;box-shadow:0 5px 0 #e0ab00}
@media (prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
